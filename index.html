<html lang="th">

            --text-dark: #334155;

            --white: #ffffff;

        * {

            color: var(--text-dark);
            line-height: 1.6;

            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .card-container {

            border: 1px solid #e2e8f0;
        }

            position: relative;
        }

            display: flex;
